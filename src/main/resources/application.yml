spring:
  application:
    name: cobre-notification-service

  datasource:
    url: jdbc:h2:mem:cobredb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Observability (Near Real-Time Monitoring via Actuator & Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Application Custom Properties
cobre:
  notification:
    seed-file: file:./notification_events.json
    classpath-seed-file: classpath:data/notification_events.json
    webhook:
      default-url: ${COBRE_WEBHOOK_URL:https://postman-echo.com/post}
      max-attempts: 5
      initial-backoff-ms: 200
      connect-timeout-ms: 10000
      read-timeout-ms: 15000
      allow-insecure-localhost: false
      signing-secret: ${COBRE_WEBHOOK_SECRET:cobre-default-hmac-secret-key-2026}
  security:
    jwt:
      # >= 32 bytes (HS256). DEMO DEFAULTS: override with real secrets via environment variables.
      secret: ${COBRE_JWT_SECRET:cobre-jwt-signing-secret-key-2026-hs256}
      expiration-seconds: ${COBRE_JWT_EXPIRATION_SECONDS:3600}
    # Credentials exchanged for a JWT at POST /auth/token (demo values for the three seeded clients).
    client-secrets:
      CLIENT001: ${COBRE_CLIENT001_SECRET:client001-demo-secret}
      CLIENT002: ${COBRE_CLIENT002_SECRET:client002-demo-secret}
      CLIENT003: ${COBRE_CLIENT003_SECRET:client003-demo-secret}
